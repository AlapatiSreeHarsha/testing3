<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        *{
            padding: 5px;
            margin: 0;
            box-sizing: border-box;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        body{
            background-color: #f4f4f4;
        }
        h2{
            text-align: center;
            font-size: 30px;
            padding-top: 20px;
        }
        .container{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
        }
        .addItems{
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .addItems input, .addItems textarea{
            width: 100%;
            margin: 5px 0;
            padding: 10px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .addItems button{
            background-color: #28a745;
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin-top: 5px;
        }
        .addItems button:hover{
            background-color: #218838;
        }
        .todoList{
            margin-top: 20px;
            width: 90%;
            max-width: 400px;
        }
        .task{
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.1);
        }
        .task.completed{
            text-decoration: line-through;
            opacity: 0.6;
        }
        .task button{
            border: none;
            background: red;
            color: white;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
        }
        .task button:hover{
            background: darkred;
        }
        .task .edit{
            background: orange;
        }
        .task .edit:hover{
            background: darkorange;
        }
        .task .complete{
            background: green;
        }
        .task .complete:hover{
            background: darkgreen;
        }
    </style>
</head>
<body>
    <h2>ToDo List</h2>
    <div class="container">
        <div class="addItems">
            <b><label for="taskTitle">Add Items</label></b>
            <input type="text" id="taskTitle" placeholder="Title" autofocus />
            <textarea id="taskDescription" placeholder="Description"></textarea>
            <button onclick="addTask()">Submit</button>
        </div>
        <div class="todoList" id="todoList"></div>
    </div>

    <script>
        function addTask() {
            let title = document.getElementById('taskTitle').value;
            let description = document.getElementById('taskDescription').value;
            if (title.trim() === "") {
                alert("Title cannot be empty!");
                return;
            }
            
            let todoList = document.getElementById('todoList');
            let taskDiv = document.createElement('div');
            taskDiv.classList.add('task');
            
            taskDiv.innerHTML = `
                <div class="taskContent">
                    <strong>${title}</strong>
                    <p>${description}</p>
                </div>
                <button class="complete" onclick="toggleTask(this)">&#10003;</button>
                <button class="edit" onclick="editTask(this)">Edit</button>
                <button onclick="deleteTask(this)">Delete</button>
            `;
            
            todoList.appendChild(taskDiv);
            
            document.getElementById('taskTitle').value = "";
            document.getElementById('taskDescription').value = "";
        }
        
        function toggleTask(button) {
            button.parentElement.classList.toggle('completed');
        }
        
        function deleteTask(button) {
            button.parentElement.remove();
        }

        function editTask(button) {
            let taskDiv = button.parentElement;
            let title = taskDiv.querySelector("strong").innerText;
            let description = taskDiv.querySelector("p").innerText;
            
            let newTitle = prompt("Edit Title:", title);
            let newDescription = prompt("Edit Description:", description);
            
            if (newTitle !== null) taskDiv.querySelector("strong").innerText = newTitle;
            if (newDescription !== null) taskDiv.querySelector("p").innerText = newDescription;
        }
    </script>
</body>
</html>
